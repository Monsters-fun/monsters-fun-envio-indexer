# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: monsters.fun
#######################################################
# GLOBAL CONTRACT DEFINITIONS
#######################################################
contracts:
  # ————————————————— 11124 contracts —————————————————
  - name: CreatureBoringFactory
    handler: src/EventHandlers.ts
    events:
      - event: event TokenCreated(address tokenAddress, string name, string symbol)

  - name: CreatureBoringToken
    handler: src/EventHandlers.ts
    events:
      - event: BattleStarted(address indexed opponent)
      - event: BattleEnded(address indexed winner, address indexed loser, uint256 transferredValue)
        field_selection:
          transaction_fields:
            - hash
      - event: Trade(address indexed trader, bool isBuy, uint256 amount, uint256 ethAmount, uint256 protocolFee)
        field_selection:
          transaction_fields:
            - hash
      - event: WhitelistPurchase(address indexed buyer, uint256 amount, uint256 ethAmount)
        field_selection:
          transaction_fields:
            - hash
      - event: Transfer(address indexed from, address indexed to, uint256 value)
        field_selection:
          transaction_fields:
            - hash
      - event: PriceUpdate(uint256 newPrice, uint256 tokenSupply, uint256 curveMultiplierValue)
        field_selection:
          transaction_fields:
            - hash
      - event: OwnershipTransferred(address indexed previousOwner, address indexed newOwner)
      - event: Paused(address account)
      - event: Unpaused(address account)

  # ————————————————— L2 Native Token (predeploy 0x...800A) —————————————————
  - name: L2NativeToken
    handler: src/EventHandlers.ts
    events:
      # Track ERC20-style Transfer for the L2 native token wrapper
      - event: Transfer(address indexed from, address indexed to, uint256 value)
        field_selection:
          transaction_fields:
            - hash

  # ————————————————— 2741 contracts —————————————————
  - name: MonsterCapsule
    handler: src/EventHandlers.ts
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 indexed tokenId)

  - name: MonstersPvpArenaV1
    handler: src/EventHandlers.ts
    events:
      - event: event ChallengeCreated(uint256 indexed matchId, address indexed player1, address indexed player2, address stakeToken, uint256 stakeAmount, bytes32 paramsHash, bytes32 clientMatchId, uint48 acceptDeadline)
        field_selection:
          transaction_fields:
            - hash
      - event: event MatchStarted(uint256 indexed matchId, address indexed player1, address indexed player2)
        field_selection:
          transaction_fields:
            - hash
      - event: event MatchResolved(uint256 indexed matchId, address indexed winner, address indexed loser, uint256 winnerPayout, uint256 feePaid, bytes32 resultHash)
        field_selection:
          transaction_fields:
            - hash
      - event: event MatchDrawn(uint256 indexed matchId, address indexed player1, address indexed player2, uint256 player1Payout, uint256 player2Payout, uint256 feePaid, bytes32 resultHash)
        field_selection:
          transaction_fields:
            - hash
      - event: event MatchCancelled(uint256 indexed matchId, address indexed caller, string reason)
        field_selection:
          transaction_fields:
            - hash

  # ————————————————— 84532 contracts —————————————————
  - name: DuelTradeCore
    handler: src/EventHandlers.ts
    events:
      - event: event StrategyRegistered(uint256 indexed strategyId, address indexed owner, address operator, address payout)
        field_selection:
          transaction_fields:
            - hash
      - event: event StrategyOwnerUpdated(uint256 indexed strategyId, address indexed previousOwner, address indexed newOwner)
        field_selection:
          transaction_fields:
            - hash
      - event: event StrategyStatusChanged(uint256 indexed strategyId, uint8 oldStatus, uint8 newStatus, string reason)
        field_selection:
          transaction_fields:
            - hash
      - event: event PayoutProposed(uint256 indexed strategyId, address oldPayout, address newPayout, uint64 readyAt)
        field_selection:
          transaction_fields:
            - hash
      - event: event PayoutChanged(uint256 indexed strategyId, address oldPayout, address newPayout)
        field_selection:
          transaction_fields:
            - hash
      - event: event PayoutChangeCancelled(uint256 indexed strategyId, address oldPendingPayout)
        field_selection:
          transaction_fields:
            - hash
      - event: event DefaultFeeUpdated(uint16 oldBps, uint16 newBps)
        field_selection:
          transaction_fields:
            - hash
      - event: event StrategyFeeUpdated(uint256 indexed strategyId, uint16 oldBps, uint16 newBps)
        field_selection:
          transaction_fields:
            - hash
      - event: event PaymentReceived(uint256 indexed paymentId, uint256 indexed strategyId, address indexed payer, address beneficiary, uint256 amount, uint16 feeBps, uint256 platformFee, uint256 netToStrategy, bytes32 offchainRef, uint32 accessDurationSec)
        field_selection:
          transaction_fields:
            - hash
      - event: event WithdrawalRequested(uint256 indexed requestId, uint256 indexed strategyId, uint256 amount, uint64 unlockTime)
        field_selection:
          transaction_fields:
            - hash
      - event: event WithdrawalBlocked(uint256 indexed requestId, uint256 indexed strategyId, address by, string reason)
        field_selection:
          transaction_fields:
            - hash
      - event: event WithdrawalReleased(uint256 indexed requestId, uint256 indexed strategyId, address to, uint256 amount, uint256 remainingEscrow)
        field_selection:
          transaction_fields:
            - hash
      - event: event PlatformFeesForwarded(address indexed to, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
      - event: event PlatformFeesForwardFailed(address indexed to, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
      - event: event PlatformFeesWithdrawn(address indexed to, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
      - event: event StrategySlashed(uint256 indexed strategyId, uint256 amount, string reason)
        field_selection:
          transaction_fields:
            - hash
      - event: event PlatformTreasuryProposed(address oldTreasury, address newTreasury, uint64 readyAt)
        field_selection:
          transaction_fields:
            - hash
      - event: event PlatformTreasuryChanged(address oldTreasury, address newTreasury)
        field_selection:
          transaction_fields:
            - hash
      - event: event Paused(address account)
        field_selection:
          transaction_fields:
            - hash
      - event: event Unpaused(address account)
        field_selection:
          transaction_fields:
            - hash

#######################################################
# MULTICHAIN SETTINGS
#######################################################
unordered_multichain_mode: true

networks:
  # ---------- ABS testnet ----------
  - id: 11124
    start_block: 11881389
    rpc: https://api.testnet.abs.xyz
    contracts:
      - name: CreatureBoringFactory
        address: "0x3B2FBD0658075349E86e5FA32881479fB3de43B2"
      - name: CreatureBoringToken
      - name: L2NativeToken
        address: "0x000000000000000000000000000000000000800A"
      - name: MonstersPvpArenaV1
        address: "0xa43668c529fDeCf46aFa52734a8eF609c4b7AfcE"

  # ---------- ABS mainnet ----------
  - id: 2741
    start_block: 9349083
    contracts:
      - name: MonsterCapsule
        address: "0x38272B362bcA267Dc8e9120087c93CefB86a69aC"
      # - name: L2NativeToken
      #   address: "0x000000000000000000000000000000000000800A"
      # - name: CreatureBoringFactory
      #   address: "0xA12A761160c4B5Cf3b1ECb36391f0102B93b79C4"
