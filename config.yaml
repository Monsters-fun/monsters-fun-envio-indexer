# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: monsters.fun
#######################################################
# GLOBAL CONTRACT DEFINITIONS
#######################################################
contracts:
  # ————————————————— 11124 contracts —————————————————
  - name: CreatureBoringFactory
    handler: src/EventHandlers.ts
    events:
      - event: event TokenCreated(address tokenAddress, string name, string symbol)

  - name: CreatureBoringToken
    handler: src/EventHandlers.ts
    events:
      - event: BattleStarted(address indexed opponent)
      - event: BattleEnded(address indexed winner, address indexed loser, uint256 transferredValue)
        field_selection:
          transaction_fields:
            - hash
      - event: Trade(address indexed trader, bool isBuy, uint256 amount, uint256 ethAmount, uint256 protocolFee)
        field_selection:
          transaction_fields:
            - hash
      - event: WhitelistPurchase(address indexed buyer, uint256 amount, uint256 ethAmount)
        field_selection:
          transaction_fields:
            - hash
      - event: Transfer(address indexed from, address indexed to, uint256 value)
        field_selection:
          transaction_fields:
            - hash
      - event: PriceUpdate(uint256 newPrice, uint256 tokenSupply, uint256 curveMultiplierValue)
        field_selection:
          transaction_fields:
            - hash
      - event: OwnershipTransferred(address indexed previousOwner, address indexed newOwner)
      - event: Paused(address account)
      - event: Unpaused(address account)

  # ————————————————— L2 Native Token (predeploy 0x...800A) —————————————————
  - name: L2NativeToken
    handler: src/EventHandlers.ts
    events:
      # Track ERC20-style Transfer for the L2 native token wrapper
      - event: Transfer(address indexed from, address indexed to, uint256 value)
        field_selection:
          transaction_fields:
            - hash

  # ————————————————— 2741 contracts —————————————————
  - name: MonsterCapsule
    handler: src/EventHandlers.ts
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 indexed tokenId)

  - name: MonstersPvpArenaV1
    handler: src/EventHandlers.ts
    events:
      - event: event ChallengeCreated(uint256 indexed matchId, address indexed player1, address indexed player2, address stakeToken, uint256 stakeAmount, bytes32 paramsHash, bytes32 clientMatchId, uint48 acceptDeadline)
        field_selection:
          transaction_fields:
            - hash
      - event: event MatchStarted(uint256 indexed matchId, address indexed player1, address indexed player2)
        field_selection:
          transaction_fields:
            - hash
      - event: event MatchResolved(uint256 indexed matchId, address indexed winner, address indexed loser, uint256 winnerPayout, uint256 feePaid, bytes32 resultHash)
        field_selection:
          transaction_fields:
            - hash
      - event: event MatchDrawn(uint256 indexed matchId, address indexed player1, address indexed player2, uint256 player1Payout, uint256 player2Payout, uint256 feePaid, bytes32 resultHash)
        field_selection:
          transaction_fields:
            - hash
      - event: event MatchCancelled(uint256 indexed matchId, address indexed caller, string reason)
        field_selection:
          transaction_fields:
            - hash

#######################################################
# MULTICHAIN SETTINGS
#######################################################
unordered_multichain_mode: true

