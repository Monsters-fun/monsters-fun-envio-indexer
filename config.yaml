      # - name: MonstersPvpArenaV1
      #   address: "0x95eF8b998c504410cbc101A2Fc93A134a30bA619"

  # ---------- Base Sepolia ----------
  - id: 84532
    start_block: 32984050
    rpc: https://sepolia.base.org
    contracts:
      - name: DuelTradeCore
        address: "0xfFf5454a2231CFac95BadD9563069f55A5fa88c9"
        abi_file_path: contracts/duelTradeCore/DuelTradeCore.json
